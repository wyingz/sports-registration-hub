<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sports Committee biweekly activity registration hub." />
  <title>Upcoming Sports Activities</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e0ea;
      --accent: #0f766e;
      --accent-dark: #115e59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(460px, 100%); margin: 0 auto; padding: 18px; }
    .hub {
      min-height: calc(100vh - 36px);
      overflow: hidden;
      border: 1px solid rgba(217, 224, 234, .9);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(23, 32, 51, .12);
    }
    header { padding: 28px 24px 20px; background: #ecfeff; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 30px; line-height: 1.08; letter-spacing: 0; }
    header p:last-child { margin: 10px 0 0; color: var(--muted); font-weight: 750; }
    .meta {
      display: grid;
      gap: 8px;
      padding: 14px 24px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #475467;
      font-size: 13px;
      font-weight: 850;
    }
    .list { padding: 18px 18px 24px; }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    footer { padding: 0 24px 24px; color: var(--muted); font-size: 12px; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <section class="hub">
      <header>
        <p class="eyebrow">Registration Hub</p>
        <h1>Upcoming Sports Activities</h1>
        <p>New biweekly cycle coming soon</p>
      </header>
      <section class="meta">
        <span>Registration details will be updated here.</span>
        <span>0 activities</span>
      </section>
      <section class="list">
        <div class="empty">No activities have been published for this cycle.</div>
      </section>
      <footer>Sports Committee</footer>
    </section>
  </main>
</body>
</html>
